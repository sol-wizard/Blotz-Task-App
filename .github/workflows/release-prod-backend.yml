name: Prod - Ship backend

# Button 2 of the three-button production release.
#
# Run this AFTER store review has passed and BEFORE pressing release in App Store
# Connect / starting the rollout in Play Console. It deploys the production API
# and records the release in GitHub.

on:
  workflow_dispatch:

concurrency:
  group: release-prod-backend
  cancel-in-progress: false

jobs:
  meta:
    name: Check the tag and collect build numbers
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.parse.outputs.version }}
      ios_build: ${{ steps.builds.outputs.ios_build }}
      android_build: ${{ steps.builds.outputs.android_build }}
    steps:
      # The dropdown accepts branches too. Running from main is exactly the mistake
      # this button exists to prevent, so refuse anything that is not a release tag.
      - name: Refuse anything but a submitted/* tag
        run: |
          set -euo pipefail
          if [ "${{ github.ref_type }}" != "tag" ]; then
            echo "::error::Run this on the submitted/<version> tag, not on ${{ github.ref_name }}."
            exit 1
          fi
          case "${{ github.ref_name }}" in
            submitted/*) ;;
            *) echo "::error::${{ github.ref_name }} is not a submitted/* tag."; exit 1 ;;
          esac

      - name: Read the version out of the tag name
        id: parse
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#submitted/}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "### Shipping the backend for \`$VERSION\`" >> "$GITHUB_STEP_SUMMARY"
          echo "From \`${{ github.ref_name }}\` (\`${{ github.sha }}\`), not from main." >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.x

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      # Build numbers only decorate the release title, so this must never be able to
      # fail the run - a change in the EAS output shape should cost a nice title, not
      # a deploy. They used to be copied by hand out of App Store Connect.
      - name: Look up the build numbers on EAS
        id: builds
        continue-on-error: true
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          VERSION: ${{ steps.parse.outputs.version }}
        working-directory: blotztask-mobile
        run: |
          set -uo pipefail
          for PLATFORM in ios android; do
            BUILD=$(eas build:list \
                      --platform "$PLATFORM" \
                      --status finished \
                      --limit 20 \
                      --json \
                      --non-interactive 2>/dev/null \
                    | jq -r --arg v "$VERSION" \
                        'map(select(.appVersion == $v)) | .[0].appBuildVersion // empty' \
                    || true)
            echo "${PLATFORM}_build=$BUILD" >> "$GITHUB_OUTPUT"
            echo "$PLATFORM build number: ${BUILD:-not found}"
          done

  deploy-api:
    name: Deploy the API from the tag
    needs: meta
    uses: ./.github/workflows/deploy-prod-api.yml
    secrets: inherit
    permissions:
      id-token: write
      contents: read

  verify:
    name: Health check
    needs: deploy-api
    runs-on: ubuntu-latest
    steps:
      # Retries ride out the App Service warm-up after the deploy - a cold .NET
      # start can take a couple of minutes. /health also covers the database,
      # which matters because the deploy runs EF migrations right before it.
      - name: Check the production API is healthy
        run: |
          set -euo pipefail
          BODY=$(curl -fsS --retry 12 --retry-delay 15 --retry-all-errors \
            https://app-blotz-task-api-prod.azurewebsites.net/health)
          echo "/health returned: $BODY"
          if [ "$BODY" != "Healthy" ]; then
            echo "::error::production API is not healthy"
            exit 1
          fi

  tag-release:
    name: Record the release
    # Only after the API is confirmed healthy, so a broken deploy never gets
    # written down as a shipped release.
    needs: [meta, verify]
    uses: ./.github/workflows/tag-release.yml
    permissions:
      contents: write
    with:
      # Passed explicitly rather than left blank. Tag Release falls back to reading
      # eas.json, and the commit this tag points at still carries the OLD version -
      # button 1 bumps the version inside its own run and only writes it back to
      # main through a pull request afterwards.
      ios_version: ${{ needs.meta.outputs.version }}
      android_version: ${{ needs.meta.outputs.version }}
      ios_build: ${{ needs.meta.outputs.ios_build }}
      android_build: ${{ needs.meta.outputs.android_build }}
      commit: ${{ github.sha }}
