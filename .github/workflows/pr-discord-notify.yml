name: PR Discord Notify

# One message per PR in Discord #blotz-pr-review, so nobody has to paste PR
# links, react with emojis or DM reviewers by hand. No AI here.
#
# PR opened / marked ready -> posts one message (webhook), pinging who must
# approve:  L1 -> @Blotz-Developer (anyone)
#           L2 / no label -> @Blotz-TechLead-candidate
#           L3 -> @Blotz-TechLead
#           L4 -> @Blotz-TechLead + candidate (1 tech lead + 1 lead or candidate)
#
# Everything after that is an emoji on that same message, so the
# channel stays at one message per PR (needs the bot token). The message
# always shows ONE status emoji — the current one replaces the previous:
#   review (re-)requested -> 👀 waiting for review
#   changes requested     -> 🔁 author needs to fix
#   approved              -> ✅ ready to merge
#   merged                -> 🎉 done
#
# Setup (once):
#   - Secret   DISCORD_PR_WEBHOOK_URL    webhook of #blotz-pr-review
#   - Secret   DISCORD_BOT_TOKEN         bot in the server with View Channel,
#                                        Read Message History, Add Reactions
#   - Variable DISCORD_PR_CHANNEL_ID     ID of #blotz-pr-review
#   - Variables DISCORD_{DEVELOPER,CANDIDATE,TECHLEAD}_ROLE_ID
# Anything missing is skipped with a warning; this job never fails a PR.

on:
  pull_request:
    types: [opened, ready_for_review, review_requested, closed]
  pull_request_review:
    types: [submitted]

permissions:
  contents: read

jobs:
  notify:
    runs-on: ubuntu-latest
    # Drafts are silent until they're marked ready; merged-only for "closed".
    if: >-
      github.event.pull_request.draft == false &&
      (github.event.action != 'closed' || github.event.pull_request.merged == true)
    steps:
      - name: Post to Discord
        env:
          WEBHOOK: ${{ secrets.DISCORD_PR_WEBHOOK_URL }}
          BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          CHANNEL: ${{ vars.DISCORD_PR_CHANNEL_ID }}
          TECHLEAD_ROLE: ${{ vars.DISCORD_TECHLEAD_ROLE_ID }}
          CANDIDATE_ROLE: ${{ vars.DISCORD_CANDIDATE_ROLE_ID }}
          DEVELOPER_ROLE: ${{ vars.DISCORD_DEVELOPER_ROLE_ID }}
          EVENT: ${{ github.event_name }}
          ACTION: ${{ github.event.action }}
          NUMBER: ${{ github.event.pull_request.number }}
          TITLE: ${{ github.event.pull_request.title }}
          URL: ${{ github.event.pull_request.html_url }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
          REQUESTED: ${{ github.event.requested_reviewer.login }}
          REVIEWER: ${{ github.event.review.user.login }}
          REVIEW_STATE: ${{ github.event.review.state }}
          SENDER: ${{ github.event.sender.login }}
        run: |
          # Skip automated PRs (release PRs, dependabot, copilot).
          case "$AUTHOR" in
            *"[bot]" | "Copilot" | "copilot-swe-agent") echo "Skipping bot PR ($AUTHOR)."; exit 0 ;;
          esac

          PR="[#$NUMBER $TITLE](<$URL>)"

          # ---- New PR: the one channel message -------------------------------
          if [ "$EVENT/$ACTION" = pull_request/opened ] || [ "$EVENT/$ACTION" = pull_request/ready_for_review ]; then
            [ -z "$WEBHOOK" ] && { echo "::warning::DISCORD_PR_WEBHOOK_URL is not set — skipping."; exit 0; }
            LEVEL=$(tr ',' '\n' <<< "$LABELS" | grep -E '^L[1-4]$' | head -1 || true)
            case "$LEVEL" in
              L1) ROLE=$DEVELOPER_ROLE ;;
              L3) ROLE=$TECHLEAD_ROLE ;;
              L4) ROLE="$TECHLEAD_ROLE $CANDIDATE_ROLE" ;;
              *)  ROLE=$CANDIDATE_ROLE ;;
            esac
            PING=""
            for r in $ROLE; do PING+="<@&$r> "; done
            MSG="🆕 ${PING}new PR by **$AUTHOR**${LEVEL:+ · level $LEVEL}"$'\n'"$PR"
            # The PR number goes in the sender name: bots without the privileged
            # Message Content intent can't read message text, but can read names.
            jq -n --arg c "$MSG" --arg n "Blotz PR Bot · #$NUMBER" \
              '{content: $c, username: $n, allowed_mentions: {parse: ["roles"]}}' |
              curl -fsS -X POST -H 'Content-Type: application/json' --data @- "$WEBHOOK"
            exit 0
          fi

          # ---- Later events: status emoji on that message --------------------
          case "$EVENT/$ACTION" in
            pull_request/review_requested)
              [ -z "$REQUESTED" ] && { echo "Team review request — skipping."; exit 0; }
              EMOJI="👀" ;;
            pull_request/closed)
              EMOJI="🎉" ;;
            pull_request_review/submitted)
              [ "$REVIEWER" = "$AUTHOR" ] && exit 0
              case "$REVIEW_STATE" in
                changes_requested)
                  EMOJI="🔁" ;;
                approved)
                  EMOJI="✅" ;;
                *) echo "Plain comment review — skipping."; exit 0 ;;
              esac ;;
            *) echo "Nothing to do for $EVENT/$ACTION."; exit 0 ;;
          esac

          if [ -z "$BOT_TOKEN" ] || [ -z "$CHANNEL" ]; then
            echo "::warning::DISCORD_BOT_TOKEN or DISCORD_PR_CHANNEL_ID not set — no emoji."
            exit 0
          fi
          api() {
            curl -fsS -H "Authorization: Bot $BOT_TOKEN" -H 'Content-Type: application/json' \
              -H 'User-Agent: DiscordBot (https://github.com/sol-wizard/Blotz-Task-App, 1)' "$@"
          }
          uri() { jq -rn --arg e "$1" '$e|@uri'; }

          # Find this PR's message among the channel's recent webhook posts,
          # by the "Blotz PR Bot · #<number>" sender name set above.
          MSG_ID=$(api "https://discord.com/api/v10/channels/$CHANNEL/messages?limit=100" |
            jq -r --arg n "Blotz PR Bot · #$NUMBER" '[.[] | select(.webhook_id != null and .author.username == $n)][0].id // empty') || true
          if [ -n "$MSG_ID" ]; then
            BASE="https://discord.com/api/v10/channels/$CHANNEL/messages/$MSG_ID/reactions"
            api -X PUT "$BASE/$(uri "$EMOJI")/@me" -o /dev/null || echo "::warning::Could not add $EMOJI."
            # Keep a single status: drop the bot's previous status emoji.
            for old in 👀 🔁 ✅ 🎉; do
              [ "$old" = "$EMOJI" ] && continue
              api -X DELETE "$BASE/$(uri "$old")/@me" -o /dev/null 2>&1 || true
            done
          else
            echo "::warning::No Discord message found for #$NUMBER — skipping the emoji."
          fi

