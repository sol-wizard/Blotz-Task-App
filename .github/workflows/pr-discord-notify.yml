name: PR Discord Notify

# One message per PR in Discord #pr-queue (bot only), so nobody has to paste PR
# links, react with emojis or DM reviewers by hand. No AI here.
#
# PR opened / reopened / marked ready -> posts one message (webhook), pinging who must
# approve:  L1 -> @Blotz-Developer (anyone)
#           L2 / no label -> @Blotz-TechLead-candidate
#           L3 -> @Blotz-TechLead
#           L4 -> @Blotz-TechLead + candidate (1 tech lead + 1 lead or candidate)
#
# Everything after that updates that same message, so the channel stays at
# one message per PR (needs the bot token):
#   - ONE status emoji, the current one replacing the previous
#   - posted under the author's GitHub name and photo, so "who" is the first
#     thing you see; the line above the card has the level and the ping
#   - a card (embed) with "#<n> · <title>" (without the "chore(x):" prefix),
#     type/scope/size in grey below; each event appends a "who did what"
#     line and recolours its side bar (a bot can only react as itself, so
#     names go in the card)
#   review (re-)requested -> 👀 "Review requested from <reviewer>"
#   changes requested     -> 🔁 "Changes requested by <reviewer>"
#   approved              -> ✅ "Approved by <reviewer>"
#
# Merged or closed -> the card is deleted, so the channel only shows PRs that
# still need something (GitHub and the board keep the history).
#
# Sync (Actions -> PR Discord Notify -> Run workflow): deletes cards of closed
# PRs and posts a card for every open PR that has none, without pinging — for
# a new channel, or after the bot missed events.
#
# Setup (once):
#   - Secret   DISCORD_PR_WEBHOOK_URL    webhook of #pr-queue
#   - Secret   DISCORD_BOT_TOKEN         bot in the server with View Channel,
#                                        Read Message History, Add Reactions
#   - Variable DISCORD_PR_CHANNEL_ID     ID of #pr-queue
#   - Variables DISCORD_{DEVELOPER,CANDIDATE,TECHLEAD}_ROLE_ID
# Anything missing is skipped with a warning; this job never fails a PR.

on:
  pull_request:
    types: [opened, reopened, ready_for_review, review_requested, closed]
  pull_request_review:
    types: [submitted]
  workflow_dispatch:  # sync: delete closed PRs' cards, post missing ones

permissions:
  contents: read
  pull-requests: read

# One run at a time per PR, in order, so two quick events (e.g. approve then
# merge) can't race and leave the wrong emoji.
concurrency:
  group: discord-pr-${{ github.event.pull_request.number || 'cleanup' }}
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest
    # Drafts are silent until they're marked ready. "closed" always runs, so a
    # PR moved back to draft before closing still loses its card.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.action == 'closed' ||
      github.event.pull_request.draft == false
    steps:
      - name: Post to Discord
        env:
          WEBHOOK: ${{ secrets.DISCORD_PR_WEBHOOK_URL }}
          BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          CHANNEL: ${{ vars.DISCORD_PR_CHANNEL_ID }}
          TECHLEAD_ROLE: ${{ vars.DISCORD_TECHLEAD_ROLE_ID }}
          CANDIDATE_ROLE: ${{ vars.DISCORD_CANDIDATE_ROLE_ID }}
          DEVELOPER_ROLE: ${{ vars.DISCORD_DEVELOPER_ROLE_ID }}
          EVENT: ${{ github.event_name }}
          ACTION: ${{ github.event.action }}
          NUMBER: ${{ github.event.pull_request.number }}
          TITLE: ${{ github.event.pull_request.title }}
          URL: ${{ github.event.pull_request.html_url }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
          AVATAR: ${{ github.event.pull_request.user.avatar_url }}
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
          REQUESTED: ${{ github.event.requested_reviewer.login }}
          REVIEWER: ${{ github.event.review.user.login }}
          REVIEW_STATE: ${{ github.event.review.state }}
          GH_TOKEN: ${{ github.token }}
        run: |
          # ---- Sync: delete cards of closed PRs, post cards for open ones -----
          if [ "$EVENT" = workflow_dispatch ]; then
            if [ -z "$WEBHOOK" ] || [ -z "$BOT_TOKEN" ] || [ -z "$CHANNEL" ]; then
              echo "::warning::Webhook, bot token or channel not set — nothing to clean."; exit 0
            fi
            curl -fsS -o /tmp/msgs -H "Authorization: Bot $BOT_TOKEN" \
              -H 'User-Agent: DiscordBot (https://github.com/sol-wizard/Blotz-Task-App, 1)' \
              "https://discord.com/api/v10/channels/$CHANNEL/messages?limit=100"
            WEBHOOK_ID=$(sed -E 's#.*/webhooks/([0-9]+)/.*#\1#' <<< "$WEBHOOK")
            jq -r --arg w "$WEBHOOK_ID" '.[] | select(.webhook_id == $w and (.author.username | test("#[0-9]+$")))
              | (.author.username | capture("#(?<n>[0-9]+)$").n) + " " + .id' /tmp/msgs |
            while read -r n id; do
              state=$(gh pr view "$n" --repo "$GITHUB_REPOSITORY" --json state --jq .state 2>/dev/null) || continue
              [ "$state" = OPEN ] && continue
              curl -fsS -o /dev/null -X DELETE "$WEBHOOK/messages/$id" &&
                echo "Deleted card for #$n ($state)" || echo "::warning::Couldn't delete card for #$n."
              sleep 0.5
            done
            # Open PRs without a card: rerun this script as their "opened"
            # event ($0 is this step's script). It skips PRs that have a card,
            # and QUIET posts without pinging.
            gh pr list --repo "$GITHUB_REPOSITORY" --state open --limit 100 \
              --json number,title,url,author,labels,isDraft \
              --jq '.[] | select(.isDraft | not) | [.number, .title, .url, .author.login,
                    ([.labels[].name] | join(","))] | @tsv' |
            while IFS=$'\t' read -r n t u a l; do
              EVENT=pull_request ACTION=opened QUIET=1 NUMBER=$n TITLE=$t URL=$u AUTHOR=$a \
                AVATAR=$(gh api "users/$a" --jq .avatar_url 2>/dev/null) LABELS=$l bash "$0" || true
              sleep 1
            done
            exit 0
          fi

          # Skip automated PRs (release PRs, dependabot, copilot).
          case "$AUTHOR" in
            *"[bot]" | "Copilot" | "copilot-swe-agent") echo "Skipping bot PR ($AUTHOR)."; exit 0 ;;
          esac

          # Posted under the author's name; the PR number in the name is how we
          # find the message again (older posts are "Blotz PR Bot · #<n>").
          NAME="$AUTHOR · #$NUMBER"
          API=https://discord.com/api/v10

          # Discord bot API call with retry on 429 (reactions are limited to
          # roughly one call per 0.25s). Prints the HTTP status.
          call() {
            local code
            for _ in 1 2 3 4 5; do
              code=$(curl -sS -o /tmp/resp -w '%{http_code}' -H "Authorization: Bot $BOT_TOKEN" \
                -H 'Content-Type: application/json' \
                -H 'User-Agent: DiscordBot (https://github.com/sol-wizard/Blotz-Task-App, 1)' "$@") || code=000
              [ "$code" != 429 ] && break
              sleep "$(jq -r '.retry_after // 1' /tmp/resp)"
            done
            echo "$code"
          }
          uri() { jq -rn --arg e "$1" '$e|@uri'; }

          # This PR's message among the channel's last 100 posts. The PR number
          # ends the sender name: bots without the privileged Message Content
          # intent can't read message text, but can read names.
          find_message() {
            [ -n "$BOT_TOKEN" ] && [ -n "$CHANNEL" ] || return 0
            [ "$(call "$API/channels/$CHANNEL/messages?limit=100")" = 200 ] || return 0
            jq -c --arg n " · #$NUMBER" '[.[] | select(.webhook_id != null and (.author.username | endswith($n)))][0] // empty' /tmp/resp
          }

          # Who has to approve, from the PBI's L1–L4 label. Read the labels fresh:
          # `gh pr create --label` adds them just after creating the PR, so the
          # "opened" event itself often has none yet.
          # Also the diff size for the card's grey line.
          SIZE=""
          if FRESH=$(gh pr view "$NUMBER" --repo "$GITHUB_REPOSITORY" --json labels,additions,deletions \
              --jq '([.labels[].name] | join(",")) + "|+\(.additions) −\(.deletions)"' 2>/dev/null); then
            LABELS=${FRESH%|*}; SIZE=${FRESH##*|}
          fi
          LEVEL=$(tr ',' '\n' <<< "$LABELS" | grep -E '^L[1-4]$' | head -1 || true)
          case "$LEVEL" in
            L1) ROLE=$DEVELOPER_ROLE; DOT="🟢" ;;
            L3) ROLE=$TECHLEAD_ROLE; DOT="🟠" ;;
            L4) ROLE="$TECHLEAD_ROLE $CANDIDATE_ROLE"; DOT="🔴" ;;
            L2) ROLE=$CANDIDATE_ROLE; DOT="🟡" ;;
            *)  ROLE=$CANDIDATE_ROLE; DOT="⚪" ;;
          esac
          # The line above the card: level + who must review (role pings only
          # work in message text).
          ping_line() {
            local ping="" r
            for r in $ROLE; do ping+=" <@&$r>"; done
            echo "$DOT **${LEVEL:-No level}** · review please$ping"
          }
          # "chore(skills): do x" -> title "do x", grey line "chore · skills · +3 −1".
          SHORT=$TITLE; KIND=""
          if [[ "$TITLE" =~ ^([a-z]+)(\(([^\)]*)\))?!?:\ *(.+)$ ]]; then
            KIND=${BASH_REMATCH[1]}${BASH_REMATCH[3]:+ · ${BASH_REMATCH[3]}}; SHORT=${BASH_REMATCH[4]}
          fi
          FOOTER=$(printf '%s\n' "$KIND" "$SIZE" | sed '/^$/d' | paste -sd'|' - | sed 's/|/ · /g')
          # The card: clickable "#n · title", history lines, grey footer, and a
          # side bar coloured by status.
          card() {  # $1 = history text, $2 = colour
            jq -n --arg t "#$NUMBER · $SHORT" --arg u "$URL" --arg f "$FOOTER" \
              --arg d "$1" --argjson c "$2" \
              '{title: ($t|.[0:256]), url: $u, color: $c}
               + (if $f == "" then {} else {footer: {text: $f}} end)
               + (if $d == "" then {} else {description: $d} end)'
          }
          GREY=10070709; BLURPLE=5793266; YELLOW=16705372; GREEN=5763719

          # ---- New PR: the one channel message -------------------------------
          # (Reopened: its card was deleted on close, so post a fresh one.)
          if [ "$EVENT/$ACTION" = pull_request/opened ] || [ "$EVENT/$ACTION" = pull_request/reopened ] ||
             [ "$EVENT/$ACTION" = pull_request/ready_for_review ]; then
            [ -z "$WEBHOOK" ] && { echo "::warning::DISCORD_PR_WEBHOOK_URL is not set — skipping."; exit 0; }
            # Draft -> ready -> draft -> ready shouldn't post and ping twice.
            if [ -n "$(find_message)" ]; then echo "#$NUMBER is already posted — skipping."; exit 0; fi
            jq -n --arg c "$(ping_line)" --arg n "$NAME" --arg a "$AVATAR" --argjson e "$(card "" $GREY)" \
              '{content: $c, username: ($n|.[0:80]), embeds: [$e], allowed_mentions: {parse: (if env.QUIET == "1" then [] else ["roles"] end)}}
               + (if $a == "" then {} else {avatar_url: $a} end)' |
              curl -fsS -X POST -H 'Content-Type: application/json' --data @- "$WEBHOOK" ||
              echo "::warning::Discord post failed — the PR is unaffected."
            exit 0
          fi

          # ---- Later events: status emoji on that message --------------------
          case "$EVENT/$ACTION" in
            pull_request/review_requested)
              [ -z "$REQUESTED" ] && { echo "Team review request — skipping."; exit 0; }
              EMOJI="👀"; COLOR=$BLURPLE; STATUS="Review requested from **$REQUESTED**" ;;
            pull_request/closed)
              # Merged or closed: delete the card (the webhook can delete its own
              # messages), so the channel only lists PRs still waiting.
              MSG_ID=$(find_message | jq -r '.id // empty')
              if [ -z "$MSG_ID" ] || [ -z "$WEBHOOK" ]; then echo "No card found for #$NUMBER."; exit 0; fi
              curl -fsS -o /dev/null -X DELETE "$WEBHOOK/messages/$MSG_ID" &&
                echo "Deleted the card for #$NUMBER." || echo "::warning::Couldn't delete the card."
              exit 0 ;;
            pull_request_review/submitted)
              [ "$REVIEWER" = "$AUTHOR" ] && exit 0
              case "$REVIEW_STATE" in
                changes_requested) EMOJI="🔁"; COLOR=$YELLOW; STATUS="Changes requested by **$REVIEWER**" ;;
                approved) EMOJI="✅"; COLOR=$GREEN; STATUS="Approved by **$REVIEWER**" ;;
                *) echo "Plain comment review — skipping."; exit 0 ;;
              esac ;;
            *) echo "Nothing to do for $EVENT/$ACTION."; exit 0 ;;
          esac

          if [ -z "$BOT_TOKEN" ] || [ -z "$CHANNEL" ]; then
            echo "::warning::DISCORD_BOT_TOKEN or DISCORD_PR_CHANNEL_ID not set — no emoji."
            exit 0
          fi
          MSG_JSON=$(find_message)
          if [ -z "$MSG_JSON" ]; then
            echo "::warning::No Discord message found for #$NUMBER in the last 100 — skipping the emoji."
            exit 0
          fi
          MSG_ID=$(jq -r .id <<< "$MSG_JSON")
          BASE="$API/channels/$CHANNEL/messages/$MSG_ID/reactions"
          # The bot's current emoji(s), so we only remove what's actually there.
          MINE=$(jq -r '(.reactions // [])[] | select(.me) | .emoji.name' <<< "$MSG_JSON")

          # Keep a single status: add the new emoji, then drop the old one(s).
          if ! grep -qxF "$EMOJI" <<< "$MINE"; then
            code=$(call -X PUT "$BASE/$(uri "$EMOJI")/@me")
            [ "$code" = 204 ] || echo "::warning::Adding $EMOJI returned HTTP $code."
          fi
          while IFS= read -r old; do
            [ -z "$old" ] || [ "$old" = "$EMOJI" ] && continue
            sleep 0.3
            code=$(call -X DELETE "$BASE/$(uri "$old")/@me")
            [ "$code" = 204 ] || echo "::warning::Removing $old returned HTTP $code."
          done <<< "$MINE"

          # Append a "who did what" line to the card so it keeps the PR's history,
          # and recolour its side bar. The bot can't read message text, but the
          # webhook can read its own message. Posts from before the card format
          # (plain text) are converted, keeping any history lines they had.
          # Edits never re-ping (allowed_mentions is empty to be sure).
          [ -z "$WEBHOOK" ] && exit 0
          OLD=$(curl -fsS "$WEBHOOK/messages/$MSG_ID") || OLD='{}'
          HISTORY=$(jq -r 'if (.embeds // []) | length > 0 then .embeds[0].description // ""
                           else (.content // "") | split("\n") | .[2:] | join("\n") end' <<< "$OLD")
          # (Older posts had " · <t:…>" timestamps on each line; drop those.)
          HISTORY=$(printf '%s\n%s' "$HISTORY" "$EMOJI $STATUS" | sed -e '/^$/d' -e 's/ · <t:[0-9]*:[a-zA-Z]>$//')
          # Discord caps a card's description at 4096 characters; drop the oldest.
          while [ "${#HISTORY}" -gt 4000 ]; do HISTORY=$(sed 1d <<< "$HISTORY"); done
          jq -n --arg c "$(ping_line)" --argjson e "$(card "$HISTORY" "$COLOR")" \
            '{content: $c, embeds: [$e], allowed_mentions: {parse: []}}' |
            curl -fsS -o /dev/null -X PATCH -H 'Content-Type: application/json' --data @- \
              "$WEBHOOK/messages/$MSG_ID" || echo "::warning::Couldn't update the card."
