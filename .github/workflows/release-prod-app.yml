name: Prod - Submit app to the stores

# Production release.
#
# Ships what was tested on staging. There is no version choice: the version only
# goes up in a staging release, which tags its commit `staging/<version>` once it
# passes. This workflow takes the highest `staging/*` tag, ships that version, and
# builds everything below from that tag's commit, even if main has moved on since.
# A hotfix therefore goes through staging first (patch -> test -> prod).
#
# Builds the production iOS + Android apps and uploads them - the iOS build to App
# Store Connect, the Android bundle to the Play production track - then tags the
# built commit `submitted/<version>`.
#
# Uploading is not submitting. Attaching the build to a version and sending it
# for App Store review is still done by hand in App Store Connect, and the Play
# upload lands as a draft (`releaseStatus: "draft"`) that only goes out when
# someone starts the rollout in the console.
#
# Then it deploys the production API from the same commit, before the build is
# sent for review. The deploy waits for approval on the `prod` environment.
#
# After that, by hand, once each store is live: in Azure set that platform's
# `AppVersion__<Ios|Android>__LatestVersion` to the new version (every release, it
# drives the optional "update available" prompt), and its
# `AppVersion__<Ios|Android>__MinimumSupportedVersion` too if this release forces
# the update. Run Tag Release on the `submitted/<version>` tag once both are live.
#
# It also builds an APK for China users, who can't use Google Play, and once the API
# is healthy publishes it to the `downloads` container in `stgblotztaskprod`: as
# `BlotzTask-<version>.apk` (history) and over `BlotzTask-latest.apk`, the file the
# website download page links to. APK users get the release then, without store review.

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release-prod
  cancel-in-progress: false

defaults:
  run:
    working-directory: blotztask-mobile

jobs:
  version:
    name: Work out the new version
    runs-on: ubuntu-latest
    outputs:
      new_version: ${{ steps.pick.outputs.new_version }}
      # The commit, not the tag name: a "none" staging re-run can move the tag while
      # this release runs, and every job below must build the same code.
      sha: ${{ steps.pick.outputs.sha }}
    steps:
      # The full history brings the staging/* tags with it.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The "Run workflow" dropdown accepts any branch. The code comes from the tag
      # either way, but this workflow file and the version PR must be main's.
      - name: Refuse to release from anything but main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::Production releases must run from main, not ${{ github.ref_name }}."
          exit 1

      - name: Pick the latest staging release
        id: pick
        run: |
          set -euo pipefail
          TAG=$(git tag -l 'staging/*' | sort -V | tail -n 1)
          if [ -z "$TAG" ]; then
            echo "::error::No staging/<version> tag found. Run a staging release first; prod ships what staging tested."
            exit 1
          fi
          NEW="${TAG#staging/}"
          SHA=$(git rev-list -n 1 "$TAG")

          # main's eas.json holds the version now in the stores (the record PR of the
          # last prod release writes it there).
          IOS_CURRENT=$(jq -r '.build.production.ios.env.APP_VERSION' eas.json)
          ANDROID_CURRENT=$(jq -r '.build.production.android.env.APP_VERSION' eas.json)
          if [ "$IOS_CURRENT" != "$ANDROID_CURRENT" ]; then
            echo "::error::production versions are out of sync (iOS $IOS_CURRENT, Android $ANDROID_CURRENT). Align them in eas.json first."
            exit 1
          fi

          # Never go backwards. The same version is fine: that is a resubmit after a
          # rejected review, and EAS still gives it a new build number.
          LOWEST=$(printf '%s\n%s\n' "$IOS_CURRENT" "$NEW" | sort -V | head -n 1)
          if [ "$NEW" != "$IOS_CURRENT" ] && [ "$LOWEST" = "$NEW" ]; then
            echo "::error::The latest staging release is $NEW, lower than production $IOS_CURRENT. Release a higher version to staging first."
            exit 1
          fi

          # Shipping the same version again is only for a resubmit before it goes live.
          # Once live, the App Store refuses it, but Google Play, the China APK and the
          # API would quietly take different code under the same number. The live iOS
          # version is the LatestVersion setting, raised by hand once the store is live.
          LIVE=$(curl -fsS --retry 3 --retry-all-errors \
                   https://app-blotz-task-api-prod.azurewebsites.net/api/app-version \
                 | jq -r '.ios.latestVersion') || LIVE=""
          if [ -z "$LIVE" ] || [ "$LIVE" = "null" ]; then
            echo "::error::Could not read the live iOS version from the production API, so the release stops here."
            exit 1
          fi
          HIGHEST=$(printf '%s\n%s\n' "$LIVE" "$NEW" | sort -V | tail -n 1)
          if [ "$NEW" = "$LIVE" ] || [ "$HIGHEST" = "$LIVE" ]; then
            echo "::error::$NEW is already live in the App Store (live: $LIVE). Release a patch to staging first."
            exit 1
          fi

          # The tagged commit still carries the production version from before, since
          # the staging release only bumps the preview profile. Write the new version
          # into that commit's eas.json, which the builds below use.
          git show "$SHA:blotztask-mobile/eas.json" \
            | jq --arg v "$NEW" '
                  .build.production.ios.env.APP_VERSION = $v
                | .build.production.android.env.APP_VERSION = $v
              ' > eas.json

          {
            echo "new_version=$NEW"
            echo "sha=$SHA"
          } >> "$GITHUB_OUTPUT"
          {
            echo "### Production release \`$IOS_CURRENT\` -> \`$NEW\`"
            echo "Building \`$TAG\` (\`$SHA\`), the commit tested on staging."
            echo "Build numbers come from EAS (\`appVersionSource: remote\`), so shipping the same version again still produces a new build."
          } >> "$GITHUB_STEP_SUMMARY"

      # This eas.json travels as an artifact so the version is written once here and
      # simply reused by the jobs below, which run on other machines.
      - uses: actions/upload-artifact@v4
        with:
          name: eas-json
          path: blotztask-mobile/eas.json

  build:
    name: Build ${{ matrix.platform }}
    needs: version
    runs-on: ubuntu-latest
    strategy:
      # Let the other platform finish rather than cancelling it. Its EAS build is
      # already running in the cloud and would be paid for either way.
      fail-fast: false
      matrix:
        platform: [ios, android]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: blotztask-mobile/package-lock.json

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm ci

      - uses: actions/download-artifact@v4
        with:
          name: eas-json
          path: blotztask-mobile

      # No --no-wait: that would only trigger the build and return immediately,
      # letting the tag below be pushed before the build result is known.
      #
      # The App Store Connect API key lives on the EAS servers rather than in this
      # repo, which is why the production profile carries no EXPO_ASC_* values.
      - name: Build and submit
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          # Apple Developer capabilities are managed by hand, same as build.ps1
          EXPO_NO_CAPABILITY_SYNC: "1"
        run: |
          eas build \
            --platform ${{ matrix.platform }} \
            --profile production \
            --auto-submit \
            --non-interactive

  # The China APK: same code and signing key as the Play build, but it opens the website
  # download page to update. Kept out of the matrix above so a failed APK never blocks the
  # store release; it is only published once the API is healthy (publish-apk below).
  build-apk:
    name: Build the China APK
    needs: version
    runs-on: ubuntu-latest
    outputs:
      apk_url: ${{ steps.build.outputs.apk_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: blotztask-mobile/package-lock.json

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm ci

      - uses: actions/download-artifact@v4
        with:
          name: eas-json
          path: blotztask-mobile

      - name: Build the APK
        id: build
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          set -euo pipefail
          URL=$(eas build \
                  --platform android \
                  --profile production-apk \
                  --non-interactive \
                  --json \
                | jq -r '.[0].artifacts.buildUrl')
          if [ -z "$URL" ] || [ "$URL" = "null" ]; then
            echo "::error::EAS did not return an APK download URL"
            exit 1
          fi
          echo "apk_url=$URL" >> "$GITHUB_OUTPUT"

  tag-and-record:
    name: Tag the submitted commit and record the version
    # Every matrix leg must pass, so a half-submitted release never gets tagged.
    needs: [version, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      # This tag is the whole point of this workflow. It pins the commit that became the
      # binaries now waiting in the store consoles, so that Tag Release can record the
      # release against it days later instead of whatever main has become by then.
      #
      # Forced because a rejected review is resubmitted under the same version, and
      # the tag should follow the code that was actually submitted last.
      - name: Tag the built commit as submitted
        env:
          SHA: ${{ needs.version.outputs.sha }}
        run: |
          set -euo pipefail
          TAG="submitted/${{ needs.version.outputs.new_version }}"
          git tag -f "$TAG" "$SHA"
          git push --force origin "refs/tags/$TAG"
          echo "### Tagged \`$TAG\` at \`$SHA\`" >> "$GITHUB_STEP_SUMMARY"
          echo "Next: approve the API deploy below. Once it is healthy, log in once with the prod build on TestFlight and check the task list loads, then submit for review. Once each store is live, set that platform's \`AppVersion__<Ios|Android>__LatestVersion\` in Azure to the new version, and its \`MinimumSupportedVersion\` too if this release forces the update. Once both are live, run **Tag Release** with commit \`$TAG\`." >> "$GITHUB_STEP_SUMMARY"

      # Only the two version lines change, on main's own eas.json. Copying the tagged
      # commit's eas.json over main would undo any eas.json change merged since the tag.
      - name: Write the submitted version into main's eas.json
        run: |
          set -euo pipefail
          jq --arg v "${{ needs.version.outputs.new_version }}" '
              .build.production.ios.env.APP_VERSION = $v
            | .build.production.android.env.APP_VERSION = $v
          ' eas.json > eas.json.tmp && mv eas.json.tmp eas.json

      # main is protected and the bot cannot push to it, so this opens a PR to merge
      # by hand. Resubmitting the same version leaves eas.json untouched and this
      # quietly no-ops.
      - name: Open a PR with the submitted version
        uses: peter-evans/create-pull-request@v7
        with:
          branch: chore/prod-release-${{ needs.version.outputs.new_version }}
          add-paths: blotztask-mobile/eas.json
          commit-message: "chore: production release ${{ needs.version.outputs.new_version }}"
          title: "chore: production release ${{ needs.version.outputs.new_version }}"
          body: |
            Records the version submitted to the stores by
            ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}.

            Tagged as `submitted/${{ needs.version.outputs.new_version }}`.

            Merge to keep `eas.json` on `main` in step with what is in the stores.

  deploy-api:
    name: Deploy the API from the submitted commit
    needs: [version, tag-and-record]
    uses: ./.github/workflows/deploy-prod-api.yml
    with:
      ref: ${{ needs.version.outputs.sha }}
    secrets: inherit
    permissions:
      id-token: write
      contents: read

  verify-api:
    name: Health check
    needs: deploy-api
    runs-on: ubuntu-latest
    steps:
      - name: Check the production API is healthy
        working-directory: .
        run: |
          set -euo pipefail
          BODY=$(curl -fsS --retry 12 --retry-delay 15 --retry-all-errors \
            https://app-blotz-task-api-prod.azurewebsites.net/health)
          echo "/health returned: $BODY"
          if [ "$BODY" != "Healthy" ]; then
            echo "::error::production API is not healthy"
            exit 1
          fi
          echo "### Production API deployed and healthy" >> "$GITHUB_STEP_SUMMARY"
          echo "Log in once with the prod build on TestFlight, then submit for review." >> "$GITHUB_STEP_SUMMARY"

  publish-apk:
    name: Publish the China APK
    # After the health check, so the APK never goes out ahead of the API it was built for.
    needs: [version, build-apk, verify-api]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    # The AZURE_* secrets and the managed identity's federated credential are scoped to
    # this environment. The identity needs "Storage Blob Data Contributor" on the container.
    environment:
      name: "prod"
    defaults:
      run:
        working-directory: .
    env:
      ACCOUNT: stgblotztaskprod
      CONTAINER: downloads
      VERSION: ${{ needs.version.outputs.new_version }}
    steps:
      - name: Download the APK from EAS
        env:
          APK_URL: ${{ needs.build-apk.outputs.apk_url }}
        run: curl -fsSL --retry 3 -o blotz.apk "$APK_URL"

      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_GHA_MANAGED_IDENTITY_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_GHA_MANAGED_IDENTITY_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # History copy first, then the fixed name the website links to. --overwrite on both:
      # a re-run resubmits the same version. no-cache on latest so phones and proxies
      # never hand out last release's file; the APK content type makes Android install it.
      - name: Upload the APK
        run: |
          set -euo pipefail
          for NAME in "BlotzTask-$VERSION.apk" "BlotzTask-latest.apk"; do
            CACHE=$([ "$NAME" = "BlotzTask-latest.apk" ] && echo "no-cache" || echo "public, max-age=31536000")
            az storage blob upload \
              --account-name "$ACCOUNT" --container-name "$CONTAINER" \
              --name "$NAME" --file blotz.apk --overwrite \
              --content-type application/vnd.android.package-archive \
              --content-cache-control "$CACHE" \
              --auth-mode login --only-show-errors --output none
          done
          URL="https://$ACCOUNT.blob.core.windows.net/$CONTAINER/BlotzTask-latest.apk"
          echo "### China APK $VERSION published" >> "$GITHUB_STEP_SUMMARY"
          echo "The download page now serves it: $URL" >> "$GITHUB_STEP_SUMMARY"

      - name: azure logout
        if: always()
        run: az logout
