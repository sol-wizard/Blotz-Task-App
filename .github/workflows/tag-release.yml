name: Tag Release

# Records a SHIPPED release (iOS + Android, which ship together) in GitHub.
# Run it by hand on the `submitted/<version>` tag once the release is live in
# both stores.
#
# It creates a `release/<date>` tag + a published GitHub Release whose notes are
# auto-generated from every PR merged since the previous release. This published
# release also becomes the new baseline for the "Preview Next Release" draft.
# It builds and submits nothing, and needs no Expo/App Store credentials.

on:
  workflow_dispatch:
    inputs:
      ios_version:
        description: "iOS version shipped (blank = the version in a submitted/<version> tag)"
        required: false
      ios_build:
        description: "iOS build number from App Store Connect (e.g. 139)"
        required: false
      android_version:
        description: "Android version shipped (blank = the version in a submitted/<version> tag)"
        required: false
      android_build:
        description: "Android version code / build from Play Console"
        required: false
      commit:
        description: "What was built - normally the submitted/<version> tag, e.g. submitted/1.4.1"
        required: true

permissions:
  contents: write

jobs:
  tag-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.commit }}

      - name: Resolve versions and tag
        id: meta
        run: |
          set -euo pipefail
          COMMIT="${{ inputs.commit }}"
          TAG_V=""
          case "$COMMIT" in submitted/*) TAG_V="${COMMIT#submitted/}" ;; esac
          IOS_V="${{ inputs.ios_version }}"
          IOS_V="${IOS_V:-$TAG_V}"
          AND_V="${{ inputs.android_version }}"
          AND_V="${AND_V:-$TAG_V}"
          if [ -z "$IOS_V" ] || [ -z "$AND_V" ]; then
            echo "::error::Give both versions, or run on a submitted/<version> tag."
            exit 1
          fi
          {
            echo "ios_v=$IOS_V"
            echo "and_v=$AND_V"
            echo "tag=release/$(date -u +%Y-%m-%d)"
            echo "sha=$(git rev-parse HEAD)"
          } >> "$GITHUB_OUTPUT"

      - name: Create tag and published release with auto-generated notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.meta.outputs.tag }}" \
            --title "Release ${{ steps.meta.outputs.tag }} — iOS ${{ steps.meta.outputs.ios_v }} (${{ inputs.ios_build }}) · Android ${{ steps.meta.outputs.and_v }} (${{ inputs.android_build }})" \
            --target "${{ steps.meta.outputs.sha }}" \
            --generate-notes
